name: "📤 제출 (Submission)"
description: "예측 결과 CSV 파일을 제출합니다. 제출 후 1~3분 뒤 이 이슈에 점수가 댓글로 달립니다."
title: "[제출] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        **제출 방법**
        1. 아래에서 대회를 선택합니다.
        2. '제출 파일' 칸에 **사이트의 '제출 파일 암호화' 페이지에서 만든 `.enc.txt` 파일**을 끌어다 놓습니다 (업로드가 끝나면 링크가 자동으로 들어갑니다). 암호화하지 않은 CSV 는 채점되지 않습니다.
        3. 'Create' 버튼을 누르면 자동 채점이 시작됩니다. 결과는 이 이슈의 댓글로 알려 드립니다.
  - type: dropdown
    id: competition
    attributes:
      label: 대회
      description: 제출할 대회를 선택하세요.
      options:
        - "대전 아파트 매매가 예측 (daejeon-house-price)"
        - "손글씨 숫자 인식 (HNU Digits) (hnu-digits)"
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: 제출 파일
      description: 사이트 '제출 파일 암호화' 페이지에서 내려받은 `.enc.txt` 파일 하나를 이 칸에 끌어다 놓으세요. 업로드가 완료되어 `[파일명](https://github.com/user-attachments/...)` 링크가 생길 때까지 기다린 뒤 제출하세요.
      placeholder: 여기에 암호화된 제출 파일(.enc.txt)을 끌어다 놓으세요
    validations:
      required: true
  - type: input
    id: note
    attributes:
      label: 메모 (선택)
      description: 사용한 모델·특징 등 간단한 설명 (본인 기록용. 이 이슈는 공개되므로 비밀로 할 내용은 적지 마세요)
      placeholder: 예) LightGBM, 로그 변환, 5-fold CV
