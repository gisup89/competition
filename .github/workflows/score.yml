name: 제출 채점 (Score submission)

# 학생이 '제출' 이슈를 열거나(첨부 방식) submissions/ 폴더에 CSV 를 추가하는 PR 을 열면 실행됩니다.
# 채점 → 이슈/PR 댓글 → leaderboard.json 커밋 → 사이트 재배포
on:
  issues:
    types: [opened, reopened]   # 닫힌 제출 이슈를 다시 열면 재채점됩니다 (일시 오류 복구용)
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

# 주의: concurrency 그룹을 쓰지 않습니다. GitHub 는 같은 그룹에서 대기 중인 실행을 1개만 남기고
# 나머지를 취소하므로, 제출이 몰리면 중간 제출이 채점 없이 사라집니다. 대신 아래 '리더보드 커밋'
# 단계에서 푸시 충돌 시 원격 최신 상태로 되돌린 뒤 다시 채점하는 방식으로 동시 제출을 처리합니다.

jobs:
  score:
    # 제출 양식이 붙이는 'submission' 라벨 또는 '[제출]' 제목 접두어 중 하나만 있으면 실행합니다.
    # (저장소에 'submission' 라벨이 없으면 양식이 라벨을 붙이지 못하므로 제목으로도 판별)
    if: >-
      github.event_name == 'pull_request_target'
      || contains(github.event.issue.labels.*.name, 'submission')
      || startsWith(github.event.issue.title, '[제출]')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.score.outputs.changed }}
    steps:
      # 보안: PR 이벤트에서도 항상 기본 브랜치(교수자 코드)만 체크아웃합니다. 학생 PR 의 코드는 실행하지 않습니다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scorer/requirements.txt

      - run: pip install -r scorer/requirements.txt

      - name: 채점
        id: score
        run: python -m scorer.process_submission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPETITION_KEY: ${{ secrets.COMPETITION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: 리더보드 커밋
        if: steps.score.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPETITION_KEY: ${{ secrets.COMPETITION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          BRANCH: ${{ github.event.repository.default_branch }}
          MSG: "score: #${{ github.event.pull_request.number || github.event.issue.number }} (${{ steps.score.outputs.competition }})"
        run: |
          git config user.name "competition-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git add competitions/*/leaderboard.json
            git commit -m "$MSG" || true
            if git push origin HEAD:"$BRANCH"; then
              echo "리더보드 푸시 완료 (시도 $i)"
              exit 0
            fi
            # 다른 제출의 채점이 먼저 푸시한 경우: 원격 최신 상태로 맞춘 뒤 이 제출만 다시 채점
            # (댓글·라벨·닫기는 1차 채점에서 이미 보냈으므로 생략)
            echo "푸시 충돌 — 원격 최신 리더보드 위에서 다시 채점합니다 (시도 $i)"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            SKIP_NOTIFY=1 python -m scorer.process_submission || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::리더보드 커밋에 반복해서 실패했습니다. 교수자가 Actions 로그를 확인해 주세요."
          exit 1

      - name: 사이트 조립
        if: steps.score.outputs.changed == 'true'
        run: python -m scorer.build_site --out _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.score.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: score
    if: needs.score.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
