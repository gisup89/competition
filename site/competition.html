<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대회</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/marked.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="./"><span class="logo">ML</span><span id="brand-title">머신러닝 경진대회</span></a>
      <nav>
        <a href="./">대회 목록</a>
        <a id="nav-repo" href="#" target="_blank" rel="noopener">저장소</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="comp-header">
      <div>
        <span id="status-badge" class="badge">…</span>
        <h1 id="title">불러오는 중…</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="kv" id="kv"></div>
    </div>

    <nav class="tabs" id="tabs">
      <a href="#overview" data-tab="overview">개요</a>
      <a href="#data" data-tab="data">데이터</a>
      <a href="#leaderboard" data-tab="leaderboard">리더보드</a>
      <a href="#submissions" data-tab="submissions">제출 기록</a>
      <a href="#submit" data-tab="submit">제출 방법 · 규칙</a>
    </nav>

    <section class="tab-panel" id="tab-overview">
      <div class="panel markdown" id="overview">불러오는 중…</div>
    </section>

    <section class="tab-panel" id="tab-data">
      <div class="panel">
        <h2>데이터 파일</h2>
        <ul class="files" id="files"></ul>
        <p class="hint" id="data-hint"></p>
      </div>
    </section>

    <section class="tab-panel" id="tab-leaderboard">
      <div class="panel">
        <div class="toolbar">
          <div class="left">
            <div class="seg" id="lb-seg">
              <button data-board="public" class="active">Public</button>
              <button data-board="private" id="btn-private" disabled>Private (최종)</button>
            </div>
            <span class="hint" id="lb-hint"></span>
          </div>
          <div class="right">
            <input class="search" id="lb-search" placeholder="참가자 검색">
          </div>
        </div>
        <div class="table-wrap" id="lb-table"></div>
      </div>
    </section>

    <section class="tab-panel" id="tab-submissions">
      <div class="panel">
        <div class="toolbar">
          <div class="left"><span class="hint" id="sub-hint"></span></div>
          <div class="right">
            <select class="search" id="sub-filter"><option value="">전체 참가자</option></select>
          </div>
        </div>
        <div class="table-wrap" id="sub-table"></div>
      </div>
    </section>

    <section class="tab-panel" id="tab-submit">
      <div class="panel" id="rules"></div>
      <div class="panel" id="howto"></div>
    </section>

    <p class="footer" id="footer"></p>
  </main>

  <script src="assets/app.js"></script>
  <script>App.renderCompetition();</script>
</body>
</html>
